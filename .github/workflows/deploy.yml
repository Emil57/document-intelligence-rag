name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest

  deploy:
    needs: test
    # Only for main, and only once the server is set up (docs/deploy-aws.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Choose the image name
        id: image
        # Registry names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Links the image to this repository, so this workflow's token can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned server key, so the deploy can't be sent to an impostor.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the server setup
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: scp -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/Caddyfile "$TARGET:app/"

      - name: Start the new version
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The token only lives as long as this job, and the server logs out right after pulling.
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" "
            set -e
            cd app
            docker login ghcr.io -u '$ACTOR' --password-stdin
            trap 'docker logout ghcr.io' EXIT
            APP_IMAGE='$IMAGE' docker compose pull
            APP_IMAGE='$IMAGE' docker compose up -d --remove-orphans
            docker image prune -f
          "

      - name: Check the site answers
        env:
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS "https://$DOMAIN/health" && exit 0
            sleep 5
          done
          echo "https://$DOMAIN/health didn't answer after 2.5 minutes" >&2
          exit 1
