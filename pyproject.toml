[project]
name = "document-intelligence-rag"
version = "0.1.0"
description = "An AI agent you can share documents, images and links with, then ask questions about them."
readme = "README.md"
authors = [
    { name = "Emil57", email = "trejocovantesde@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
